<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 200px;
            padding: 15px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h3 { margin-top: 0; font-size: 16px; text-align: center; color: #333; }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover { background-color: #0b5ed7; }
    </style>
</head>
<body>
<h3>Wybierz AI</h3>
<select id="ai-choice">
    <option value="chatgpt">ChatGPT</option>
    <option value="claude">Claude</option>
    <option value="gemini">Gemini</option>
</select>
<button id="solve-btn">SOLVE</button>
<script src="popup.js"></script>
</body>
</html>
